<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>form_controls</title>
         <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    </head>
        <body>
            <div class="container">
                <form action="/server" class="mb-3"><!--form controls : used to eail password inputs -->
              <div class="mb-3">
                <h2>Form-Demo</h2>
                <label for="email" class="form-label">Enter Email:</label>
                <input type="text" id="email" placeholder="abc12@gmail.com" class="form-control">
                
              </div>

                <div class="mb-3">
                    <label for="pass" class="from-label" >Password:</label>
                    <input type="text" class="form-control" id="pass" placeholder="Enter a Password">
                    </form>
               </div>

               <div mb-3><!--select: this is for the dropdown optin -->
                <select class="from-select">    
                
                    <option selected>choose gender</option>
                    <option >male</option>
                    <option >female</option>
                    <option >other</option>
                </select>
               
               </div>
               <!-- checkbox and radion -->
                <br>
                <div class="mb-3">
                    <!--Normal cheackbox without bootstrap-->
                    <div class="normal">
                        <input type="checkbox" name="agree" id="agree">
                        <label for="agree" >agree</label>
                    </div>
                </div>
                 <!-- cheackbox with bootstrap-->

                 <div class="form-check">
                    <input type="checkbox" id="ag" class="form-check-input">
                    <label for="ag" class="form-check-label">Agree</label>
                 </div>
            </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        </body>
</html>

       <!-- dif bet checkbox&radio is in radio e click only one option & in CB we click multiple option-->  
       <Form action="/server">
            <input type="checkbox" name="subjects" id="maths" value="maths">
            <label for="maths">maths</label>

            <input type="checkbox" name="subjects" id="physics" value="physics">
            <label for="physics">physics</label>

            <input type="checkbox" name="subjects" id="chemistry" value="chemistry">
            <label for="chemistry"> chemistry</label>
            <button>submit</button>
       
       <!--Select element : dragdown button -->
       <div>

              <select name="profession" id="profession">

       <!--range :used to set range-->

            max="100"

            step="10"
            value="70"
            >

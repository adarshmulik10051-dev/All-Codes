<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HTML Entities</title>
    </head>
    <body>
        <!--HTML Entities:It is a string that start with '&'(amphersand) and end with ';'-->   
         <!--  
               1) it is used to display reserved charecter
               2)used to display reserved characetr(hearts,clouds,man) and ivisible spaces  
         -->

        <!--  < :  &lt; , >: &gt;  -->
          <P>&lt;</P>
          <p>&gt;</p>

        <!-- &: &amp;-->  
         <p>&amp;</p>

        <!--"": &quot;-->
         <p>Hi i am &quot;adarsh&quot;</p>

        <!--'':&apos;apostropy-->
         <p>&apos;adarsh&apos;</p>

        <!--  :&nbsp-->
         <p>&nbsp; ad&nbsp;arsh</p>

        <!-- - :&nddash; --> 
         <p>pre&ndash;order</p>

        <!-- - - : &mdash; --> 
        <p> ABC&mdash;</p>
        
        <!-- © :&copy;-->
         <p>ab&copy;</p>
        
        <!--® : &reg;--> 
        <p>ADA&reg;SH</p>

        <!-- ™ :&trade;-->
         <p>&trade;</p>

        <!-- ≈ : &asymp;--> 
         <p>0.333 &asymp;0.3</p>

        <!-- ≠ : &nt;-->
         <p>a&ne;b</p> 
        <!-- ° : &deg;--> 
         <p>23&deg;cel</p>

    </body>
</html>
